name: Push notifications

# Manual-only: real-time delivery is handled by the onPushQueued Cloud
# Function (see functions/index.js) now. This stays as a fallback you can
# run by hand — Actions tab → "Push notifications" → "Run workflow" — to
# drain anything that piled up in pushQueue while that function was down,
# or before it's deployed at all. No schedule trigger here anymore: running
# both a poller and the real-time function on a schedule would race to
# send/delete the same queue entries.
on:
  workflow_dispatch: {}

jobs:
  drain-push-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: push-worker/package-lock.json

      - run: npm ci
        working-directory: push-worker

      - run: node drain.js
        working-directory: push-worker
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
