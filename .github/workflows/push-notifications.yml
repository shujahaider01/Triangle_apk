name: Push notifications

on:
  schedule:
    # GitHub's minimum cron granularity is 1 minute but scheduled runs are
    # only best-effort and can be delayed under load — 5 minutes keeps this
    # cheap while still being fast enough for task/habit-style notifications
    # (this is not a chat delivery path; see push-worker/drain.js).
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  # Dev's queue (triangle-apk) — unchanged from before the qa/prod split.
  drain-push-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: push-worker/package-lock.json

      - run: npm ci
        working-directory: push-worker

      - run: node drain.js
        working-directory: push-worker
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}

  # QA (triangle-qa) and prod (triangle-prod) each have their own database
  # now that every environment has its own Firebase project — drain.js only
  # ever talks to one project per run, so each needs its own invocation with
  # its own pair of repo secrets:
  #   FIREBASE_SERVICE_ACCOUNT_JSON_QA / FIREBASE_DB_URL_QA
  #   FIREBASE_SERVICE_ACCOUNT_JSON_PROD / FIREBASE_DB_URL_PROD
  # (Settings > Secrets and variables > Actions > New repository secret.)
  drain-push-queue-qa-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment: [qa, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: push-worker/package-lock.json

      - run: npm ci
        working-directory: push-worker

      - run: node drain.js
        working-directory: push-worker
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ matrix.environment == 'qa' && secrets.FIREBASE_SERVICE_ACCOUNT_JSON_QA || secrets.FIREBASE_SERVICE_ACCOUNT_JSON_PROD }}
          FIREBASE_DB_URL: ${{ matrix.environment == 'qa' && secrets.FIREBASE_DB_URL_QA || secrets.FIREBASE_DB_URL_PROD }}
