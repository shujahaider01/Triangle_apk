name: Push notifications

on:
  schedule:
    # GitHub's minimum cron granularity is 1 minute but scheduled runs are
    # only best-effort and can be delayed under load — 5 minutes keeps this
    # cheap while still being fast enough for task/reward-style notifications
    # (this is not a chat delivery path; see push-worker/drain.js).
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  drain-push-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: push-worker/package-lock.json

      - run: npm ci
        working-directory: push-worker

      - run: node drain.js
        working-directory: push-worker
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
